name: Release

# Dormant until you push a version tag. Nothing here runs on a normal push.
#
#   npm version minor        # bumps package.json and creates the tag
#   git push --follow-tags   # this workflow takes it from there
#
# Publishing uses npm provenance: the registry records a signed, verifiable link from the
# published tarball back to this workflow run and commit. That requires `id-token: write`
# below and only works from CI — a publish from a laptop cannot produce it.
#
# Auth is trusted publishing: npm has this repo and this workflow file registered as a trusted
# publisher, so the OIDC token minted below is exchanged for a short-lived credential. There is no
# NPM_TOKEN secret — nothing to leak or rotate, and no other workflow in this repo can publish.
#
# The OIDC claim must match npm's configuration exactly. This job declares no `environment:`,
# because none is configured on the npm side. If you add one, add it in BOTH places or the
# exchange is rejected.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A tag that disagrees with package.json publishes a version nobody can trace back to a
      # commit, which is exactly what provenance is supposed to prevent.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Resolve playwright-core version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: node dist/cli/index.js install-browser

      # The browser binary links against system libraries the cache never restores. Without them
      # Chromium dies during startup and Playwright waits for a handshake that never arrives, so
      # the failure looks like a hung test rather than a launch error.
      - name: Install browser system dependencies
        run: sudo npx --yes playwright install-deps chromium

      - name: Chromium smoke test
        run: |
          node --input-type=module -e "
            import { chromium } from 'playwright-core';
            const browser = await chromium.launch({ headless: true });
            console.log('launched:', browser.version());
            await browser.close();
          "

      # The full suite gates the release. A version that cannot pass its own determinism test has
      # no business being published.
      - name: Test
        run: npm test

      # Trusted publishing needs a newer npm than Node 20 bundles. It exchanges the OIDC token
      # minted by `id-token: write` above for a short-lived credential, so there is no NPM_TOKEN
      # secret in this repo — nothing to leak, nothing to rotate, and only this workflow file can
      # publish. Provenance is generated automatically as part of that exchange.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --provenance --access public

      - name: Dry run (no publish)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm publish --provenance --access public --dry-run
