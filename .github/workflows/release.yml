name: Release

# Dormant until you push a version tag. Nothing here runs on a normal push.
#
#   pnpm version minor       # bumps package.json, runs sync-version.mjs, creates the tag
#   git push --follow-tags   # this workflow takes it from there
#
# Publishing uses npm provenance: the registry records a signed, verifiable link from the
# published tarball back to this workflow run and commit. That requires `id-token: write`
# below and only works from CI — a publish from a laptop cannot produce it.
#
# Auth is trusted publishing: npm has this repo and this workflow file registered as a trusted
# publisher, so the OIDC token minted below is exchanged for a short-lived credential. There is no
# NPM_TOKEN secret — nothing to leak or rotate, and no other workflow in this repo can publish.
#
# The OIDC claim must match npm's configuration exactly. This job declares no `environment:`,
# because none is configured on the npm side. If you add one, add it in BOTH places or the
# exchange is rejected.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions:
  # `contents: write` so the workflow can create the GitHub Release for the tag.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Before setup-node: `cache: pnpm` shells out to pnpm to find the store, so pnpm must exist.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json publishes a version nobody can trace back to a
      # commit, which is exactly what provenance is supposed to prevent.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Resolve playwright-core version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: node dist/cli/index.js install-browser

      # The browser binary links against system libraries the cache never restores. Without them
      # Chromium dies during startup and Playwright waits for a handshake that never arrives, so
      # the failure looks like a hung test rather than a launch error.
      - name: Install browser system dependencies
        run: sudo npx --yes playwright install-deps chromium

      - name: Chromium smoke test
        run: |
          node --input-type=module -e "
            import { chromium } from 'playwright-core';
            const browser = await chromium.launch({ headless: true });
            console.log('launched:', browser.version());
            await browser.close();
          "

      # The full suite gates the release. A version that cannot pass its own determinism test has
      # no business being published.
      - name: Test
        run: pnpm test

      # Installing and running scripts is pnpm's job in this repo; publishing stays npm's. The
      # trusted-publisher registration on the registry names this repo and this workflow and expects
      # an `npm publish` OIDC exchange, npm ships with the runner regardless, and the tarball a
      # consumer installs should be produced by the tool that publishes it. `npm publish` runs
      # `prepack`, which is `pnpm run build` — pnpm is on PATH from action-setup above.
      #
      # Trusted publishing needs a newer npm than Node 20 bundles. It exchanges the OIDC token
      # minted by `id-token: write` above for a short-lived credential, so there is no NPM_TOKEN
      # secret in this repo — nothing to leak, nothing to rotate, and only this workflow file can
      # publish. Provenance is generated automatically as part of that exchange.
      # Pinned to a major on purpose: `npm@latest` is npm 12, which requires Node >=22.22.2 and
      # fails EBADENGINE on anything older. npm 11 supports trusted publishing (>=11.5.1) and runs
      # on both Node 20 and 22, so the release job cannot break because npm shipped a new major.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      # A version can already be on the registry — the first release was published by hand, and a
      # re-run or a re-pushed tag would otherwise die on EPUBLISHCONFLICT. npm never allows
      # republishing a version, so skipping is the only correct behaviour, not a workaround.
      - name: Check whether this version is already published
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on the registry — skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: (github.event_name == 'push' || inputs.dry_run == false) && steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public

      - name: Dry run (no publish)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm publish --provenance --access public --dry-run

      # A git tag is not a GitHub Release — they are separate objects, and the Releases section of
      # the repo stays empty until one exists. Created after publish so a release never advertises
      # a version the registry does not have.
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists — leaving it alone"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
