name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      # Before setup-node, not after: `cache: pnpm` resolves the store path by running pnpm, so pnpm
      # has to be on PATH already. The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Chromium lives outside node_modules, so it needs its own cache. The key is tied to the
      # playwright-core version: a bumped dependency must fetch a matching browser build, and a
      # stale browser is how determinism tests fail for reasons unrelated to the change under test.
      - name: Resolve playwright-core version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Dogfooding on purpose: if `vdiff install-browser` breaks, CI finds out before a user does.
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: node dist/cli/index.js install-browser

      # `install-browser` fetches the browser, not the shared libraries it links against. Without
      # these the process dies during startup and Playwright waits for a handshake that never
      # arrives — which surfaces as a hung beforeAll, not as a launch error. Cached browsers need
      # this too: the cache restores the binary, never the system packages.
      - name: Install browser system dependencies
        run: sudo npx --yes playwright install-deps chromium

      # Fail in seconds with a real error rather than after four 240s hook timeouts.
      - name: Chromium smoke test
        run: |
          node --input-type=module -e "
            import { chromium } from 'playwright-core';
            const browser = await chromium.launch({ headless: true });
            console.log('launched:', browser.version());
            await browser.close();
          "

      - name: Test
        run: pnpm test

      # The slow suite (real worktree + a dependency install + replay at a historical SHA) is
      # deliberately excluded: it takes minutes and needs network inside the worktree. Run it with
      # `pnpm run test:slow` locally, or via workflow_dispatch on the slow-path job below.

  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Guards the npx story: the tarball must stay small, must not leak sources or sourcemaps,
      # and must actually contain the skills that ship alongside the CLI.
      # `npm pack`, not `pnpm pack`: the tarball a consumer installs is the one npm publishes, so the
      # thing under test has to be produced by the same tool that produces the release.
      - name: Pack and inspect the tarball
        run: |
          npm pack --dry-run --json --ignore-scripts > /dev/null || true
          pnpm run build
          npm pack --ignore-scripts
          TARBALL=$(ls -t ./*.tgz | head -1)
          echo "tarball: $TARBALL"
          tar -tzf "$TARBALL" > /tmp/pack-list.txt
          wc -l < /tmp/pack-list.txt

          fail=0
          if grep -q '\.map$' /tmp/pack-list.txt; then
            echo "::error::sourcemaps present in the published tarball"; fail=1
          fi
          if grep -qE 'package/src/|\.test\.' /tmp/pack-list.txt; then
            echo "::error::sources or tests leaked into the published tarball"; fail=1
          fi
          for skill in visual-diff visual-diff-flows visual-diff-review; do
            if ! grep -q "package/dist/skills/$skill/SKILL.md" /tmp/pack-list.txt; then
              echo "::error::skill $skill is missing from the tarball"; fail=1
            fi
          done
          if ! grep -q 'package/dist/skills/manifest.json' /tmp/pack-list.txt; then
            echo "::error::skills manifest is missing from the tarball"; fail=1
          fi
          exit $fail

  slow:
    name: slow path (historical replay)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node dist/cli/index.js install-browser
      - run: pnpm run test:slow
