<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="visual-diff — replay a UI flow across revisions, diff the pixels, name the DOM">
  <title>visual-diff</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121514"/>
      <stop offset="0.55" stop-color="#0b0d0c"/>
      <stop offset="1" stop-color="#0b0d0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6ab2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6ab2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#e4e6e4" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f1e"/>
      <stop offset="1" stop-color="#0b0d0c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <ellipse cx="1040" cy="190" rx="420" ry="300" fill="url(#glow)"/>
  <rect x="0" y="398" width="1280" height="2" fill="#ff6ab2" fill-opacity="0.5"/>

  <!-- ── mark ─────────────────────────────────────────────────────────── -->
  <g transform="translate(72 120) scale(0.875)">
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14" fill="url(#tile)" stroke="#2a2f2c" stroke-width="1.5"/>
    <line x1="32" y1="15" x2="32" y2="49" stroke="#3d4441" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/>
    <g fill="#6e756f">
      <rect x="10" y="19" width="19" height="6" rx="2"/>
      <rect x="10" y="29" width="12" height="6" rx="2"/>
      <rect x="10" y="39" width="19" height="6" rx="2"/>
      <rect x="35" y="19" width="19" height="6" rx="2"/>
      <rect x="35" y="39" width="19" height="6" rx="2"/>
    </g>
    <rect x="35" y="29" width="19" height="6" rx="2" fill="#ff6ab2"/>
    <rect x="32.5" y="25.5" width="24" height="13" rx="3.5" fill="#ff6ab2" fill-opacity="0.12" stroke="#ff6ab2" stroke-width="1.5" stroke-opacity="0.85"/>
  </g>

  <!-- ── wordmark + tagline ───────────────────────────────────────────── -->
  <text x="146" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6" fill="#f2f2ef">visual<tspan fill="#3d4441">-</tspan><tspan fill="#ff6ab2">diff</tspan></text>

  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#9aa09c">
    <tspan x="74" y="222">Replay an agent-authored UI flow across revisions.</tspan>
    <tspan x="74" y="250">Pixels say <tspan fill="#e4e6e4">where</tspan> changed. The DOM says <tspan fill="#e4e6e4">what</tspan> changed.</tspan>
  </text>

  <g>
    <rect x="72" y="284" width="352" height="44" rx="10" fill="#171a19" stroke="#2b302e" stroke-width="1"/>
    <text x="92" y="312" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e4e6e4"><tspan fill="#56d364">$</tspan> npx @beprajwal/visual-diff</text>
  </g>

  <!-- ── base pane ────────────────────────────────────────────────────── -->
  <text x="700" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="0.6" fill="#6e756f">HEAD~1</text>
  <g>
    <rect x="700.5" y="118.5" width="239" height="169" rx="10" fill="#101211" stroke="#2a2f2c" stroke-width="1"/>
    <path d="M700.5 138.5h239" stroke="#2a2f2c" stroke-width="1"/>
    <g fill="#3d4441">
      <circle cx="714" cy="128" r="3"/><circle cx="724" cy="128" r="3"/><circle cx="734" cy="128" r="3"/>
    </g>
    <g fill="#2b302e">
      <rect x="716" y="156" width="120" height="10" rx="3"/>
      <rect x="716" y="176" width="208" height="7" rx="3"/>
      <rect x="716" y="189" width="164" height="7" rx="3"/>
    </g>
    <rect x="716" y="222" width="76" height="26" rx="7" fill="#2a2f2c"/>
    <rect x="716" y="268" width="96" height="7" rx="3" fill="#212523"/>
  </g>

  <!-- ── head pane, with the changed region named ─────────────────────── -->
  <text x="968" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="0.6" fill="#9aa09c">HEAD</text>
  <g>
    <rect x="968.5" y="118.5" width="239" height="169" rx="10" fill="#101211" stroke="#2a2f2c" stroke-width="1"/>
    <path d="M968.5 138.5h239" stroke="#2a2f2c" stroke-width="1"/>
    <g fill="#3d4441">
      <circle cx="982" cy="128" r="3"/><circle cx="992" cy="128" r="3"/><circle cx="1002" cy="128" r="3"/>
    </g>
    <g fill="#2b302e">
      <rect x="984" y="156" width="120" height="10" rx="3"/>
      <rect x="984" y="176" width="208" height="7" rx="3"/>
      <rect x="984" y="189" width="164" height="7" rx="3"/>
    </g>
    <rect x="984" y="222" width="104" height="34" rx="8" fill="#ff6ab2" fill-opacity="0.22"/>
    <rect x="984" y="222" width="104" height="34" rx="8" fill="none" stroke="#ff6ab2" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="984" y="268" width="96" height="7" rx="3" fill="#212523"/>
    <rect x="976" y="214" width="120" height="46" rx="6" fill="none" stroke="#ff6ab2" stroke-width="1.5"/>
  </g>

  <!-- leader from the region to what the DOM says it is -->
  <path d="M1036 260v38" stroke="#ff6ab2" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="1036" cy="260" r="2.5" fill="#ff6ab2"/>
  <g>
    <rect x="912.5" y="298.5" width="295" height="32" rx="8" fill="#171a19" stroke="#2a2f2c" stroke-width="1"/>
    <circle cx="930" cy="314.5" r="3.5" fill="#ff6ab2"/>
    <text x="943" y="319" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#9aa09c">button.pay <tspan fill="#3d4441">·</tspan> padding <tspan fill="#e4e6e4">8px</tspan> → <tspan fill="#ff6ab2">12px</tspan></text>
  </g>
</svg>
