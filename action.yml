# visual-diff — a composite GitHub Action (CI spec §8, D34).
#
# The behaviour of CI mode lives here rather than in the workflow files `vdiff install
# github-actions` writes. Those are forty lines a user owns and edits; this is the pipeline, versioned
# with the package, so a fix reaches every repository on the next tag.
#
# What it does, in order, and why the order matters:
#
#   resolve → install → base side → head side → diff → export → publish → artifact → comment → gate
#
# The gate is last on purpose (D35). A job that failed before commenting leaves a red check with no
# explanation of what changed, which is the worst artifact this feature could produce.
#
# Nothing here asks `vdiff` to talk to GitHub. The CLI renders markdown and writes a directory (D29);
# the token is used by exactly two steps — the comment and the optional branch publish — both of them
# ordinary API calls that are visible in this file.
name: visual-diff
description: Replay UI flows at the merge-base and at the head, diff them, and comment the result on the pull request.
author: Prajwal Raj Basnet

branding:
  icon: eye
  color: purple

inputs:
  flows:
    description: >-
      Whitespace-separated flow names. Empty means every flow in .visual-diff/flows.
    required: false
    default: ''
  mode:
    description: >-
      pr — replay both sides and comment. baseline — capture this commit and cache it for later pull
      requests to restore (D32).
    required: false
    default: pr
  base-ref:
    description: >-
      Revision the base side is taken at. Empty means the merge-base of the pull request.
    required: false
    default: ''
  baseline:
    description: 'auto | cache | replay — where the base side comes from (D32).'
    required: false
    default: auto
  head-network:
    description: >-
      record | replay — how the head side reaches the network (D48). `record` (the default) lets the
      pull request's code talk to the live backend and records what it saw: a change that adds or
      alters a request is the thing under review, and a recording made by the base has no answer
      for it. `replay` serves the head from the base's recording instead, which is deterministic
      but fails any step whose requests the base never made.
    required: false
    default: record
  fail-on:
    description: >-
      none | high | any. Default none: findings are reported and the check stays green (D30).
    required: false
    default: none
  images:
    description: 'changed | all | none — which shots the evidence bundle carries.'
    required: false
    default: changed
  html:
    description: >-
      linked | inline | both — how the bundle's report.html addresses its images. `linked` (the
      default) uses relative paths into images/. `inline` embeds them as data: URIs, so the one file
      is the whole report — the shape to pick when something serves or shares it as a single object.
      `both` writes the linked page plus a self-contained report.inline.html beside it. Anything but
      `linked` needs a CLI newer than 0.5.2 — mind that when pinning `cli:` yourself.
    required: false
    default: linked
  comment:
    description: 'Post (or update) the pull-request comment.'
    required: false
    default: 'true'
  artifact:
    description: 'Upload the evidence bundle as a workflow artifact.'
    required: false
    default: 'true'
  artifact-name:
    description: 'Artifact name.'
    required: false
    default: visual-diff
  publish-branch:
    description: >-
      Branch to push this pull request's diff images to. Set it and the comment embeds them; leave it
      empty and the comment links the artifact instead, because GitHub cannot render an image out of
      one (D31). Requires contents: write.
    required: false
    default: ''
  pages-url:
    description: >-
      URL GitHub Pages serves `publish-branch` at, e.g. `https://<owner>.github.io/<repo>` (Settings →
      Pages → Deploy from a branch, pointed at that branch). Set both and the comment's "Open the
      full report" call to action opens this pull request's report.html as a page (D40). Who can see
      it is the repository's Pages visibility: private Pages on GitHub Enterprise Cloud, public
      otherwise. Ignored without `publish-branch`.
    required: false
    default: ''
  anthropic-api-key:
    description: >-
      Anthropic API key, from a repository secret. Set it and `vdiff review` asks the model to read
      each diff and write the review the comment opens with — the headline change, what is not
      accounted for by the pull request's description, what looks broken (D39). The key reaches the
      review step only. Empty skips the review; the comment then carries the numbers alone.
    required: false
    default: ''
  openai-api-key:
    description: >-
      OpenAI API key, the same way. When both keys are set, Anthropic is used.
    required: false
    default: ''
  review-model:
    description: >-
      Model id for the review. Empty uses the provider's default (`claude-opus-5` / `gpt-6-astra`).
    required: false
    default: ''
  anthropic-federation-rule-id:
    description: >-
      Keyless review through Anthropic Workload Identity Federation (D43): the `fdrl_…` rule that
      trusts this repository's GitHub OIDC token. Set it, with the organization and service-account
      ids below, and the job mints a short-lived Anthropic token from its own identity instead of
      reading a stored key. The workflow must grant `id-token: write`. Ignored when
      `anthropic-api-key` is set — a key wins, as it does in the SDK.
    required: false
    default: ''
  anthropic-organization-id:
    description: 'Anthropic organization UUID, for federation.'
    required: false
    default: ''
  anthropic-service-account-id:
    description: 'The `svac_…` service account the federation rule targets.'
    required: false
    default: ''
  anthropic-workspace-id:
    description: >-
      The `wrkspc_…` workspace to scope the minted token to. Required only when the rule is enabled
      for more than one workspace.
    required: false
    default: ''
  install:
    description: >-
      Command that installs the project's dependencies before the head run. Empty auto-detects from
      the lockfile; `false` skips it entirely.
    required: false
    default: ''
  node-version:
    description: 'Node used to run vdiff.'
    required: false
    default: '20'
  version:
    description: 'Version of @beprajwal/visual-diff to install. Ignored when `cli` is set.'
    required: false
    default: '0.14.1'
  cli:
    description: >-
      Command that invokes the CLI. Empty — the default — installs the package globally and calls
      `vdiff`. Set it to skip that install and use a CLI that is already there: `npx vdiff` for a
      project that pins the package as a devDependency, or `vdiff` for one that installed it itself.
      Must be a plain command with no quoting; it is word-split.
    required: false
    default: ''
  working-directory:
    description: 'Directory holding .visual-diff/.'
    required: false
    default: '.'
  github-token:
    description: >-
      Token used by the comment and publish steps only. The comment's author is this token's
      identity: github-actions by default. Ignored when `app-id` is set.
    required: false
    default: ${{ github.token }}
  app-id:
    description: >-
      Id of a GitHub App to comment as (D49). Create one named "Visual Diff" in the organization,
      give it the logo, grant it pull requests: write (and contents: write when `publish-branch` is
      set), install it on the repository, and the comment carries the app's name and avatar instead
      of github-actions. Requires `app-private-key`.
    required: false
    default: ''
  app-private-key:
    description: 'Private key of the GitHub App named by `app-id`. Pass it from a secret.'
    required: false
    default: ''

outputs:
  findings:
    description: 'Total findings across every flow.'
    value: ${{ steps.render.outputs.findings }}
  high:
    description: 'High-severity findings across every flow.'
    value: ${{ steps.render.outputs.high }}
  changed-steps:
    description: 'Steps that changed, across every flow.'
    value: ${{ steps.render.outputs.changed_steps }}
  gate:
    description: 'ok | failed — the configured gate''s verdict (D30).'
    value: ${{ steps.render.outputs.gate }}
  bundle-dir:
    description: 'Directory holding one evidence bundle per flow.'
    value: ${{ steps.resolve.outputs.bundle_root }}
  comment-file:
    description: 'Rendered markdown for the first flow. One file per flow lives in bundle-dir.'
    value: ${{ steps.render.outputs.comment_file }}
  artifact-url:
    description: 'URL of the uploaded bundle, when one was uploaded.'
    value: ${{ steps.upload.outputs.artifact-url }}
  report-url:
    description: >-
      URL of the first flow's report.html as a page, when `publish-branch` and `pages-url` are both
      set (D40). One page per flow lives under the same prefix.
    value: ${{ steps.render.outputs.report_url }}
  reviewed:
    description: 'true when a model wrote the review for at least one flow (D39); false otherwise.'
    value: ${{ steps.export.outputs.reviewed }}

runs:
  using: composite
  steps:
    # ---------------------------------------------------------------- resolve
    #
    # Everything derived is derived once, here, and written to outputs. A later step that recomputed
    # the flow list or the merge-base could disagree with the comment about which pair was compared.
    - name: Resolve inputs
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FLOWS_INPUT: ${{ inputs.flows }}
        MODE: ${{ inputs.mode }}
        BASE_REF_INPUT: ${{ inputs.base-ref }}
        BASELINE: ${{ inputs.baseline }}
        FAIL_ON: ${{ inputs.fail-on }}
        IMAGES: ${{ inputs.images }}
        HEAD_NETWORK: ${{ inputs.head-network }}
        PUBLISH_BRANCH: ${{ inputs.publish-branch }}
        PAGES_URL: ${{ inputs.pages-url }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail

        case "$MODE" in pr|baseline) ;; *) echo "::error::mode must be pr or baseline, got '$MODE'"; exit 2 ;; esac
        # A Pages URL without a branch to serve has nothing to point at. Said once here rather than
        # discovered from a comment whose call to action 404s (D40).
        if [ -n "$PAGES_URL" ] && [ -z "$PUBLISH_BRANCH" ]; then
          echo "::warning::pages-url is set but publish-branch is empty — nothing is published, so the comment will not link a hosted report"
        fi
        case "$BASELINE" in auto|cache|replay) ;; *) echo "::error::baseline must be auto, cache or replay, got '$BASELINE'"; exit 2 ;; esac
        case "$FAIL_ON" in none|high|any) ;; *) echo "::error::fail-on must be none, high or any, got '$FAIL_ON'"; exit 2 ;; esac
        case "$IMAGES" in changed|all|none) ;; *) echo "::error::images must be changed, all or none, got '$IMAGES'"; exit 2 ;; esac
        case "$HEAD_NETWORK" in record|replay) ;; *) echo "::error::head-network must be record or replay, got '$HEAD_NETWORK'"; exit 2 ;; esac

        if [ ! -d .visual-diff ]; then
          echo "::error::no .visual-diff directory in $(pwd) — run \`vdiff init\` and commit it"
          exit 2
        fi

        # Flow names: whatever was asked for, or every spec on disk. A flow named but absent is an
        # error rather than a silently smaller run.
        flows="$FLOWS_INPUT"
        if [ -z "${flows// }" ]; then
          flows=$(find .visual-diff/flows -maxdepth 1 -name '*.yaml' -exec basename {} .yaml \; 2>/dev/null | sort | tr '\n' ' ')
        fi
        flows=$(echo "$flows" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')
        if [ -z "$flows" ]; then
          echo "::error::no flows found in .visual-diff/flows and none named via the flows input"
          exit 2
        fi
        for flow in $flows; do
          if [ ! -f ".visual-diff/flows/$flow.yaml" ]; then
            echo "::error::flow '$flow' has no spec at .visual-diff/flows/$flow.yaml"
            exit 2
          fi
        done
        echo "flows=$flows" >> "$GITHUB_OUTPUT"

        # The base side. For a pull request it is the merge-base, not the base branch tip: comparing
        # against a tip that moved since the branch was cut reports other people's changes as yours.
        base_sha=''
        if [ "$MODE" = "pr" ]; then
          target="${BASE_REF_INPUT:-$PR_BASE_SHA}"
          if [ -z "$target" ]; then
            echo "::error::not a pull request and no base-ref given — nothing to compare against"
            exit 2
          fi
          if ! git cat-file -e "$target^{commit}" 2>/dev/null; then
            echo "base revision $target is not in this clone; fetching it"
            git fetch --no-tags --depth=1 origin "$target" || {
              echo "::error::could not fetch base revision $target — check out with fetch-depth: 0"
              exit 2
            }
          fi
          base_sha=$(git merge-base "$target" HEAD 2>/dev/null || echo "$target")
          echo "base revision: $base_sha"
        fi
        echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

        # One hash over the specs, so a baseline captured before a flow changed is not restored for a
        # flow that no longer looks like it.
        spec_hash=$( { cat .visual-diff/config.yaml .visual-diff/flows/*.yaml 2>/dev/null || true; } | shasum -a 256 | cut -c1-16)
        echo "spec_hash=$spec_hash" >> "$GITHUB_OUTPUT"

        echo "bundle_root=${RUNNER_TEMP}/visual-diff" >> "$GITHUB_OUTPUT"
        mkdir -p "${RUNNER_TEMP}/visual-diff"

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Skipped when `cli` names a command that already exists — which is how this repository dogfoods
    # the action against a locally packed tarball, and how a project that pins the package as a
    # devDependency avoids a second copy of it.
    - name: Install vdiff
      if: inputs.cli == ''
      shell: bash
      env:
        VDIFF_VERSION: ${{ inputs.version }}
      run: npm install --global "@beprajwal/visual-diff@${VDIFF_VERSION}"

    - name: Report the CLI in use
      shell: bash
      env:
        CLI: ${{ inputs.cli }}
      run: |
        set -euo pipefail
        ${CLI:-vdiff} --version

    # Chromium lives outside node_modules, so it needs its own cache entry. Keyed by the vdiff
    # version: a bumped playwright-core must fetch a matching browser build, and a stale browser is
    # how a diff fails for reasons that have nothing to do with the change under test.
    - name: Cache Chromium
      id: chromium
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: vdiff-chromium-${{ runner.os }}-${{ inputs.version }}

    - name: Install Chromium
      if: steps.chromium.outputs.cache-hit != 'true'
      shell: bash
      env:
        CLI: ${{ inputs.cli }}
      run: ${CLI:-vdiff} install-browser

    # The browser download is not the shared libraries it links against, and the cache restores the
    # binary rather than the system packages. Without these the process dies during startup and
    # Playwright waits for a handshake that never arrives — which surfaces as a hang, not an error.
    - name: Install browser system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo npx --yes playwright install-deps chromium

    - name: Install project dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL: ${{ inputs.install }}
      run: |
        set -euo pipefail
        if [ "$INSTALL" = "false" ]; then
          echo "install: skipped by input"
          exit 0
        fi
        # The head side replays against the working tree, so the dev server this project starts needs
        # its dependencies. A historical revision is different: `vdiff run --at` installs inside its
        # own worktree using the command in .visual-diff/config.yaml.
        command="$INSTALL"
        if [ -z "${command// }" ]; then
          if [ -f pnpm-lock.yaml ]; then command='corepack pnpm install --frozen-lockfile'
          elif [ -f yarn.lock ]; then command='corepack yarn install --immutable'
          elif [ -f package-lock.json ]; then command='npm ci'
          elif [ -f package.json ]; then command='npm install'
          else command='' ; fi
        fi
        if [ -z "$command" ]; then
          echo "install: no lockfile and no package.json — nothing to install"
          exit 0
        fi
        echo "install: $command"
        eval "$command"

    # ---------------------------------------------------------------- the base side (D32)
    # The recordings travel with the runs (D42): a baseline captured on the default branch recorded
    # each flow's HAR, and a pull request that restores it replays the same traffic on both sides
    # instead of recording afresh against a backend that may have drifted since. HARs are gitignored
    # by design, so this cache is the only place CI can get one from.
    - name: Restore baseline runs
      id: baseline
      if: inputs.mode == 'pr' && inputs.baseline != 'replay'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.visual-diff/runs
          ${{ inputs.working-directory }}/.visual-diff/flows/*.har
        key: vdiff-runs-${{ runner.os }}-${{ steps.resolve.outputs.spec_hash }}-${{ steps.resolve.outputs.base_sha }}

    - name: Replay the base revision
      if: inputs.mode == 'pr' && steps.baseline.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FLOWS: ${{ steps.resolve.outputs.flows }}
        BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
        BASELINE: ${{ inputs.baseline }}
        CLI: ${{ inputs.cli }}
        # A first run records the flow's HAR and reads it back whole to scrub it; a large app's
        # recording is hundreds of megabytes of JSON, more than Node's default heap. The runner has
        # the memory; the process is told it may use it. Inherited by the dev server it spawns.
        NODE_OPTIONS: --max-old-space-size=6144
      run: |
        set -euo pipefail
        cli=${CLI:-vdiff}
        if [ "$BASELINE" = "cache" ]; then
          echo "::error::no cached baseline for $BASE_SHA and baseline: cache forbids replaying it"
          exit 2
        fi
        # A missing baseline is a slower job, never a failed one — the same posture the store takes
        # when a diff needs a run that does not exist.
        echo "::notice::no cached baseline for $BASE_SHA; replaying the base revision (slower)"
        for flow in $FLOWS; do
          $cli run "$flow" --at "$BASE_SHA"
        done

    # ---------------------------------------------------------------- the head side
    - name: Replay the working tree
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FLOWS: ${{ steps.resolve.outputs.flows }}
        CLI: ${{ inputs.cli }}
        HEAD_NETWORK: ${{ inputs.head-network }}
        NODE_OPTIONS: --max-old-space-size=6144
      run: |
        set -euo pipefail
        cli=${CLI:-vdiff}
        # The head records by default (D48): the base's recording — restored from the cache or made
        # a step ago — has no answer for a request the pull request added, and a replay that aborts
        # it fails the step for the wrong reason. `replay` is for a flow whose traffic is known not
        # to change.
        for flow in $FLOWS; do
          if [ "${HEAD_NETWORK:-record}" = "record" ]; then
            $cli run "$flow" --record
          else
            $cli run "$flow"
          fi
        done

    # A replay that failed leaves its evidence — the failure screenshot, the DOM at the moment,
    # server.log, install.log — in a run directory on a runner nobody can open. Keep it, so the reason
    # a step failed is one download away rather than a re-run with more logging.
    - name: Upload the runs when a replay failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}-runs
        path: ${{ inputs.working-directory }}/.visual-diff/runs
        if-no-files-found: ignore
        retention-days: 7

    # In baseline mode that is the whole job: capture, cache, stop. Nothing is diffed, because there
    # is nothing yet to diff it against.
    - name: Save the baseline
      if: inputs.mode == 'baseline'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.visual-diff/runs
          ${{ inputs.working-directory }}/.visual-diff/flows/*.har
        key: vdiff-runs-${{ runner.os }}-${{ steps.resolve.outputs.spec_hash }}-${{ github.sha }}

    # ---------------------------------------------------------------- keyless review (D43)
    #
    # With a federation rule named and no key, the job's own GitHub identity is exchanged for a
    # short-lived Anthropic token — once, here, because a GitHub OIDC token carries `jti` and can be
    # exchanged exactly one time; a job reviewing three flows would otherwise fail on the second.
    # The result is masked and handed to the review step as ANTHROPIC_AUTH_TOKEN. Needs
    # `id-token: write` on the workflow, which the installed template documents.
    - name: Mint an Anthropic token from the runner identity
      id: oidc
      if: inputs.mode == 'pr' && inputs.anthropic-federation-rule-id != '' && inputs.anthropic-api-key == ''
      uses: actions/github-script@v7
      env:
        FEDERATION_RULE_ID: ${{ inputs.anthropic-federation-rule-id }}
        ORGANIZATION_ID: ${{ inputs.anthropic-organization-id }}
        SERVICE_ACCOUNT_ID: ${{ inputs.anthropic-service-account-id }}
        WORKSPACE_ID: ${{ inputs.anthropic-workspace-id }}
      with:
        script: |
          // The review is a paragraph a key buys; the evidence and the comment are what the job
          // promises. So nothing in this step fails the job: a denied exchange is a warning, the
          // token output stays empty, and the comment goes out with the numbers alone (D39, D43).
          const { FEDERATION_RULE_ID, ORGANIZATION_ID, SERVICE_ACCOUNT_ID, WORKSPACE_ID } = process.env;
          core.setOutput('token', '');
          for (const [name, value] of Object.entries({ ORGANIZATION_ID, SERVICE_ACCOUNT_ID })) {
            if (!value) {
              core.warning(`anthropic-federation-rule-id is set but anthropic-${name.toLowerCase().replace('_', '-')} is empty; the review is skipped`);
              return;
            }
          }
          const assertion = await core.getIDToken('https://api.anthropic.com');
          const body = {
            grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
            assertion,
            federation_rule_id: FEDERATION_RULE_ID,
            organization_id: ORGANIZATION_ID,
            service_account_id: SERVICE_ACCOUNT_ID,
            ...(WORKSPACE_ID ? { workspace_id: WORKSPACE_ID } : {}),
          };
          const origin = (process.env.ANTHROPIC_BASE_URL || 'https://api.anthropic.com').replace(/\/+$/, '');
          const response = await fetch(`${origin}/v1/oauth/token`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body),
          });
          const text = await response.text();
          if (!response.ok) {
            // The deny reason is deliberately opaque here; the Console's authentication history has it.
            // The most common cause is the rule's subject: a job that runs in a GitHub Environment
            // presents `repo:<owner>/<repo>:environment:<name>`, not the branch or pull_request form.
            core.warning(`token exchange answered ${response.status}: ${text.slice(0, 300)} — the review is skipped. Check the rule's match against this run's sub claim (repo:${context.repo.owner}/${context.repo.repo}:…) in the Claude Console authentication history`);
            return;
          }
          const token = JSON.parse(text).access_token;
          if (!token) {
            core.warning('token exchange answered without an access_token; the review is skipped');
            return;
          }
          core.setSecret(token);
          core.setOutput('token', token);
          core.info(`minted a federated Anthropic token for the review (expires in ${JSON.parse(text).expires_in}s)`);

    # ---------------------------------------------------------------- diff, review and export
    #
    # The review (D39) sits between the diff and the export so the bundle, the page and the comment
    # all carry it. It is the only step that holds a model API key, and the key goes to `vdiff review`
    # alone — the CLI still never sees the GitHub token (D29). A review that fails is a warning, not a
    # failed job: the evidence is what CI mode promises, the paragraph is what a key buys.
    - name: Diff, review and export
      id: export
      if: inputs.mode == 'pr'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FLOWS: ${{ steps.resolve.outputs.flows }}
        BUNDLE_ROOT: ${{ steps.resolve.outputs.bundle_root }}
        IMAGES: ${{ inputs.images }}
        HTML: ${{ inputs.html }}
        CLI: ${{ inputs.cli }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        # The federated bearer minted above (D43); empty when no rule was named or a key was.
        ANTHROPIC_AUTH_TOKEN: ${{ steps.oidc.outputs.token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        REVIEW_MODEL: ${{ inputs.review-model }}
        # What the model judges the change against: without it, "unrelated" cannot be told from
        # "intended", and the review says so.
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        cli=${CLI:-vdiff}
        reviewed=false

        context_file=''
        if [ -n "${PR_TITLE}${PR_BODY}" ]; then
          context_file="${RUNNER_TEMP}/vdiff-pr-context.md"
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$context_file"
        fi

        for flow in $FLOWS; do
          # `diff` first so its human output lands in the log: a reader scanning the job should see
          # the finding table without downloading anything.
          $cli diff "$flow"

          if [ -n "${ANTHROPIC_API_KEY}${ANTHROPIC_AUTH_TOKEN}${OPENAI_API_KEY}" ]; then
            args=(review "$flow")
            if [ -n "$REVIEW_MODEL" ]; then args+=(--model "$REVIEW_MODEL"); fi
            if [ -n "$context_file" ]; then args+=(--context "$context_file"); fi
            if $cli "${args[@]}"; then
              reviewed=true
            else
              echo "::warning::vdiff review failed for flow '$flow' (exit $?); the comment will carry the numbers without a review"
            fi
          fi

          # `--html` is only passed when it deviates from the default, so a user-pinned `cli:` older
          # than the flag keeps working until they opt in.
          if [ "${HTML:-linked}" = "linked" ]; then
            $cli export "$flow" --images "$IMAGES" --out "$BUNDLE_ROOT/$flow"
          else
            $cli export "$flow" --images "$IMAGES" --html "$HTML" --out "$BUNDLE_ROOT/$flow"
          fi
        done
        echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------- publish images (D31)
    #
    # Only when a branch was nominated. Pushing images into someone's repository on every pull request
    # is not a default anybody should get by surprise, so the artifact is the default and this is the
    # opt-in that makes inline images possible at all.
    # The comment is signed by whoever holds the token. A GitHub App gives the pull request a
    # comment from "Visual Diff" with its mark, rather than one from github-actions or from the
    # person whose token the workflow happened to use (D49). The installation token is minted
    # here, scoped to this repository, and used by the two steps that talk to GitHub.
    - name: Sign in as the Visual Diff app
      id: app
      if: inputs.mode == 'pr' && inputs.app-id != ''
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Publish diff images
      id: publish
      if: inputs.mode == 'pr' && inputs.publish-branch != ''
      shell: bash
      env:
        BUNDLE_ROOT: ${{ steps.resolve.outputs.bundle_root }}
        FLOWS: ${{ steps.resolve.outputs.flows }}
        BRANCH: ${{ inputs.publish-branch }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.github-token }}
        REPO: ${{ github.repository }}
        SERVER: ${{ github.server_url }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PAGES_URL: ${{ inputs.pages-url }}
      run: |
        set -euo pipefail
        # `vdiff` sits between the pull request and the commit so the branch can hold other things
        # under the same pull request without colliding, and so a Pages URL reads as ours:
        #   <pages-url>/pr-13/vdiff/4f9c2a1b7e3d/checkout/report.html
        prefix="pr-${PR_NUMBER:-manual}/vdiff/${SHA:0:12}"
        work="${RUNNER_TEMP}/vdiff-publish"
        rm -rf "$work"
        # The token rides on the clone as well as the push: a private repository answers an
        # anonymous clone with a username prompt, which is exit 128 on a runner. The runner masks
        # the token in the log.
        remote="https://x-access-token:${GH_TOKEN}@${SERVER#https://}/${REPO}.git"
        git clone --depth 1 --branch "$BRANCH" "$remote" "$work" 2>/dev/null || {
          # First publish: an orphan branch, so the image history never touches the code history.
          git clone --depth 1 "$remote" "$work"
          git -C "$work" checkout --orphan "$BRANCH"
          git -C "$work" rm -rf . >/dev/null 2>&1 || true
          printf '%s\n' \
            '# visual-diff images' '' \
            'Generated by the visual-diff action. Safe to delete: it holds only diff screenshots.' \
            > "$work/README.md"
        }

        for flow in $FLOWS; do
          target="$work/$prefix/$flow"
          mkdir -p "$target"
          if [ -d "$BUNDLE_ROOT/$flow/images" ]; then
            cp -R "$BUNDLE_ROOT/$flow/images" "$target/"
          fi
          cp "$BUNDLE_ROOT/$flow/report.html" "$target/" 2>/dev/null || true
          cp "$BUNDLE_ROOT/$flow/report.inline.html" "$target/" 2>/dev/null || true
        done

        cd "$work"
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        if git diff --cached --quiet; then
          echo "nothing new to publish"
        else
          git commit -m "visual-diff: ${prefix}"
          git push "$remote" "HEAD:${BRANCH}"
        fi
        # The same files as a *site* (D40): raw.githubusercontent.com serves report.html as text, so
        # the page needs Pages in front of the branch. The user names that URL; this derives the
        # per-pull-request prefix under it. Pages deploys a pushed branch in about a minute, so the
        # link may 404 briefly after the first push of a new prefix.
        #
        # When Pages is there, the comment's images come from it too (D50): raw.githubusercontent.com
        # answers a private repository's files only to a signed-in fetch, which an <img> in a comment
        # is not, so on a private repository the raw URLs render as broken images. Pages serves the
        # same files under the site's own visibility — the organisation on Enterprise Cloud, everyone
        # otherwise — which is what the user chose when they set the URL.
        if [ -n "$PAGES_URL" ]; then
          echo "report_base=${PAGES_URL%/}/${prefix}" >> "$GITHUB_OUTPUT"
          echo "image_base=${PAGES_URL%/}/${prefix}" >> "$GITHUB_OUTPUT"
        else
          echo "image_base=https://raw.githubusercontent.com/${REPO}/${BRANCH}/${prefix}" >> "$GITHUB_OUTPUT"
        fi

    # ---------------------------------------------------------------- artifact, then comment
    #
    # The artifact goes up before the comment is rendered, because the comment links it: every
    # truncation notice in the body points at findings.json inside this upload (D33).
    - name: Upload the evidence bundle
      id: upload
      if: inputs.mode == 'pr' && inputs.artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.resolve.outputs.bundle_root }}
        if-no-files-found: warn
        retention-days: 14

    - name: Render the comment
      id: render
      if: inputs.mode == 'pr'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FLOWS: ${{ steps.resolve.outputs.flows }}
        BUNDLE_ROOT: ${{ steps.resolve.outputs.bundle_root }}
        IMAGE_BASE: ${{ steps.publish.outputs.image_base }}
        REPORT_BASE: ${{ steps.publish.outputs.report_base }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        FAIL_ON: ${{ inputs.fail-on }}
        CLI: ${{ inputs.cli }}
      run: |
        set -euo pipefail
        cli=${CLI:-vdiff}
        findings=0
        high=0
        changed=0
        gate=ok
        first=''
        report_url=''

        for flow in $FLOWS; do
          args=(comment "$flow" --json --fail-on "$FAIL_ON" --artifact-name "$ARTIFACT_NAME"
                --out "$BUNDLE_ROOT/$flow/comment.md")
          if [ -n "$IMAGE_BASE" ]; then args+=(--image-base "$IMAGE_BASE/$flow"); fi
          if [ -n "$ARTIFACT_URL" ]; then args+=(--artifact-url "$ARTIFACT_URL"); fi
          # The hosted page (D40): the comment's call to action, rendered with the verdict.
          if [ -n "$REPORT_BASE" ]; then
            args+=(--report-url "$REPORT_BASE/$flow/report.html")
            if [ -z "$report_url" ]; then report_url="$REPORT_BASE/$flow/report.html"; fi
          fi

          # `--fail-on` exits 3 when it trips (D30). The verdict is collected here and enforced in
          # the last step of the job, after the comment has been posted (D35).
          set +e
          $cli "${args[@]}" > "$BUNDLE_ROOT/$flow/comment.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "::error::vdiff comment failed for flow '$flow' (exit $status)"
            cat "$BUNDLE_ROOT/$flow/comment.json" >&2 || true
            exit "$status"
          fi
          if [ "$status" -eq 3 ]; then gate=failed; fi

          summary=$(node -e '
            const fs = require("node:fs");
            const envelope = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const data = envelope.data ?? {};
            const s = data.result?.summary ?? {};
            process.stdout.write([
              s.totalFindings ?? 0,
              s.bySeverity?.high ?? 0,
              s.stepsChanged ?? 0,
            ].join(" "));
          ' "$BUNDLE_ROOT/$flow/comment.json")
          read -r f h c <<< "$summary"
          findings=$((findings + f))
          high=$((high + h))
          changed=$((changed + c))
          if [ -z "$first" ]; then first="$BUNDLE_ROOT/$flow/comment.md"; fi

          {
            echo "### visual-diff — \`$flow\`"
            echo
            cat "$BUNDLE_ROOT/$flow/comment.md"
          } >> "$GITHUB_STEP_SUMMARY"
        done

        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "high=$high" >> "$GITHUB_OUTPUT"
        echo "changed_steps=$changed" >> "$GITHUB_OUTPUT"
        echo "gate=$gate" >> "$GITHUB_OUTPUT"
        echo "comment_file=$first" >> "$GITHUB_OUTPUT"
        echo "report_url=$report_url" >> "$GITHUB_OUTPUT"

    # One comment per flow, found by its marker and updated in place, so a pull request with fourteen
    # pushes has one visual-diff comment per flow rather than fourteen (D33).
    - name: Post the comment
      if: inputs.mode == 'pr' && inputs.comment == 'true' && github.event.pull_request.number
      uses: actions/github-script@v7
      env:
        FLOWS: ${{ steps.resolve.outputs.flows }}
        BUNDLE_ROOT: ${{ steps.resolve.outputs.bundle_root }}
      with:
        github-token: ${{ steps.app.outputs.token || inputs.github-token }}
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const issue_number = context.payload.pull_request.number;
          const { owner, repo } = context.repo;

          const existing = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });

          for (const flow of process.env.FLOWS.trim().split(/\s+/).filter(Boolean)) {
            const file = path.join(process.env.BUNDLE_ROOT, flow, 'comment.md');
            if (!fs.existsSync(file)) {
              core.warning(`no rendered comment for flow ${flow}`);
              continue;
            }
            const body = fs.readFileSync(file, 'utf8');
            // The marker is the comment's first line, written by `vdiff comment` itself.
            const marker = body.split('\n', 1)[0].trim();
            if (!marker.startsWith('<!--')) {
              core.warning(`comment for ${flow} carries no marker; posting without upsert`);
            }

            const previous = existing.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
              core.info(`updated comment ${previous.id} for flow ${flow}`);
            } else {
              const created = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`created comment ${created.data.id} for flow ${flow}`);
            }
          }

    # Last, and only when asked for (D30, D35): the evidence exists, the comment is posted, and now
    # the check can go red.
    - name: Enforce the gate
      if: inputs.mode == 'pr' && steps.render.outputs.gate == 'failed'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        FINDINGS: ${{ steps.render.outputs.findings }}
        HIGH: ${{ steps.render.outputs.high }}
      run: |
        echo "::error::visual-diff gate '${FAIL_ON}' failed — ${FINDINGS} finding(s), ${HIGH} high severity. See the comment on this pull request for what changed."
        exit 1
