# A screen with no backend behind it at all (mocking spec D13, §5 'The two modes').
#
# `mode: mock` means there is no recording: every request the page makes is either answered by a
# rule here or aborted and reported as a miss. That is the whole point — this is the mode for UI
# built ahead of the API it will eventually call, and the foundation subsystem 3 is built on.
#
# The bodies below are invented, and the tool says so: the run records `network: mock` in
# meta.json and any diff against a recorded run is flagged `mock-vs-recorded` at high severity,
# because comparing a fiction to a measurement is not a regression test. Fidelity is only ever as
# good as this file.
#
# `patch` and `patchOps` are rejected in this mode at validation time (§5): a merge patch with
# no recorded body to merge into would produce whatever the patch alone contains and look like it
# had worked.
version: 1
scenario: mock-detail
description: The detail screen with no recording behind it — invented forecast and air quality
mode: mock

